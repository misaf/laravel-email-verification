name: Validate application container

on:
  pull_request:
  push:
    branches:
      - 1.x

jobs:
  entrypoint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate entrypoint shell script
        run: sh -n docker-entrypoint.sh

  build-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both environment files are gitignored, so a checkout carries neither and
      # the rule under test would have nothing to exclude. Planting them is what
      # makes this a test rather than a tautology.
      - name: Plant environment files
        run: |
          printf 'APP_KEY=planted\n' > .env
          printf 'DB_ROOT_PASSWORD=planted\n' > docker/stacks/.env

      # Copies the real build context into a scratch image and fails if any
      # environment file survived .dockerignore. The pattern is the thing being
      # guarded: a bare ".env" matches the context root only, which left
      # docker/stacks/.env — and the estate's database root password with it —
      # available to any local build.
      - name: Assert no environment file reaches the build context
        run: |
          cat > /tmp/context-check.Dockerfile <<'DOCKERFILE'
          FROM busybox
          COPY . /context
          RUN found="$(find /context -name '.env' -o -name '.env.*')"; \
              [ -z "$found" ] || { echo "environment files reached the build context:"; echo "$found"; exit 1; }
          DOCKERFILE
          docker build --no-cache -f /tmp/context-check.Dockerfile .

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Asserts against the *rendered* stack rather than the source, so it
      # exercises interpolation, the YAML anchors, and the dev overlay's merge —
      # the three ways these values have silently changed without the file that
      # declares them being touched.
      - name: Assert the platform stack renders as intended
        run: |
          cat > /tmp/stack.env <<'ENV'
          APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BASE_DOMAIN=example.test
          DB_PASSWORD=ci
          DB_ROOT_PASSWORD=ci
          VENDRA_PLATFORM_IMAGE=ghcr.io/example/vendra:ci
          ENV
          cd docker/stacks
          for mode in production development; do
            overlay=""
            [ "$mode" = development ] && overlay="-f platform/docker-compose.dev.yml"
            # shellcheck disable=SC2086
            docker compose --project-directory platform --env-file /tmp/stack.env \
              -f platform/docker-compose.yml $overlay config --format json > /tmp/rendered.json

            # Every service that waits on php waits for it to be *healthy*: php
            # runs the migrations in its entrypoint, and service_started let the
            # others begin against a half-applied schema.
            bad_dep="$(jq -r '[ .services | to_entries[]
              | select(.value.depends_on.php != null)
              | select(.value.depends_on.php.condition != "service_healthy")
              | .key ] | join(", ")' /tmp/rendered.json)"

            # No service logs to a file. Only /app/storage/app is a volume, so a
            # file channel writes into a layer that is discarded on every deploy.
            bad_log="$(jq -r '[ .services | to_entries[]
              | select(.value.environment.LOG_CHANNEL != null)
              | select(.value.environment.LOG_CHANNEL != "stderr")
              | .key ] | join(", ")' /tmp/rendered.json)"

            [ -z "$bad_dep" ] || { echo "${mode}: services not waiting for a healthy php: ${bad_dep}"; exit 1; }
            [ -z "$bad_log" ] || { echo "${mode}: services not logging to stderr: ${bad_log}"; exit 1; }
            echo "${mode}: ok"
          done
