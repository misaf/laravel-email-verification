name: Bug report
description: Report reproducible incorrect behavior in the core package or a driver package.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Core package
        - Driver package
        - Docker or deployment
        - Documentation
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package
      description: Provide the package name when the issue is package-specific.
      placeholder: misaf/laravel-email-verification-bouncer
  - type: textarea
    id: behavior
    attributes:
      label: Current behavior
      description: Describe what happened, including the exact error when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include package version or commit, PHP, Laravel, database, and relevant package versions.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs or screenshots after removing secrets and personal data.
